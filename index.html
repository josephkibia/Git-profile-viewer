<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Git Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="app">
        <h1>Git Hub profile viewer</h1>
        <p class="subtitle">Enter a github to view their profile</p>

        <div class="search-box">
            <input type="text" id="username-input" placeholder="e.g. JosephKibia" >
            <button id="search-btn">Search</button>

        </div>
        <div class="loading" id="loading" hidden>Fetching Profile...</div>
        <div class="error" id="error" hidden >error</div>

        <div class="profile-section" id="profile-section" hidden>
            <div class="profile-header">
                <img src="" id="avatar" class="avatar" alt="User avatar">
                <div class="profile-info">
                    <h2  id="display-name">JosephKibia</h2>
                    <p class="bio" id="bio"></p>
                    <div class="stats">
                        <div class="stat">
                            <strong id="followers-count">0</strong>
                            <span>followers</span>
                        </div>
                         <div class="stat">
                            <strong id="following-count">0</strong>
                            <span>following</span>
                        </div>
                         <div class="stat">
                            <strong id="repos-count">0</strong>
                            <span>Repos</span>
                        </div>

                    </div>
                </div>
            </div>
            <h3>Top Repositories</h3>
            <div id="repos-list" class="repos-list"></div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
